# LiteLLM para el workflow BIRADS 4B. Los alias son los que usa birads4b_discussion_v2.json.
# Ollama corre en el contenedor "ollama" de la misma red (birads-net).
model_list:
  - model_name: gemma3:270m                  # Pre-validacion
    litellm_params: { model: ollama/gemma3:270m, api_base: "http://ollama:11434" }

  - model_name: qwen3:14b                    # Radiologa (moderadora)
    litellm_params: { model: ollama/qwen3:14b, api_base: "http://ollama:11434" }

  - model_name: llama3.1:8b-local            # Cirujano y Radioterapeuta
    litellm_params: { model: ollama/llama3.1:8b, api_base: "http://ollama:11434" }

  - model_name: qwen3.5:9b-local             # Oncologa
    litellm_params: { model: ollama/qwen3.5:9b, api_base: "http://ollama:11434" }

  - model_name: tomng/lfm2.5-instruct:latest # Patologo
    litellm_params: { model: ollama/tomng/lfm2.5-instruct:latest, api_base: "http://ollama:11434" }

  - model_name: llama3.2-local               # Ginecologa
    litellm_params: { model: ollama/llama3.2:latest, api_base: "http://ollama:11434" }

  - model_name: lfm2.5-thinking:latest       # Sintesis final
    litellm_params: { model: ollama/lfm2.5-thinking:latest, api_base: "http://ollama:11434" }

litellm_settings:
  request_timeout: 900   # modelos locales grandes tardan en cargar
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
