# Stack local del comite BIRADS 4B: Ollama + LiteLLM + n8n
#
#   CPU: docker compose up -d
#   GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Host:  n8n http://localhost:5678 | LiteLLM http://localhost:4000 | Ollama http://localhost:11434
# Red interna (birads-net): http://ollama:11434, http://litellm:4000
services:
  ollama:
    image: ollama/ollama:latest
    container_name: birads-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      # GPU de 8 GB: un modelo a la vez, sin pelear por VRAM entre agentes
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Los prompts de Ronda 2 y Sintesis llevan las respuestas de todos los agentes (>4096 tokens)
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama-state:/root/.ollama
      - ${OLLAMA_MODELS_PATH:-C:/Users/david/.ollama/models}:/root/.ollama/models:ro
    networks: [birads-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: birads-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy
    networks: [birads-net]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: birads-n8n
    ports:
      - "5678:5678"
    environment:
      TZ: ${TZ:-America/Mexico_City}
      GENERIC_TIMEZONE: ${TZ:-America/Mexico_City}
      # El workflow lee estas variables con $env (n8n 2.x las bloquea por defecto)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local}
      # Las rondas con modelos locales son largas
      EXECUTIONS_TIMEOUT: "-1"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./birads4b_discussion_v2.json:/workflows/birads4b_discussion_v2.json:ro
    depends_on:
      - litellm
    networks: [birads-net]
    restart: unless-stopped

volumes:
  ollama-state:
  n8n-data:

networks:
  birads-net:
    name: birads-net
